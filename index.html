<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfterGlow</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <!-- The Settings window (opened from the tray). src/main.js -->
    <header>
      <pre id="mark" class="mark" aria-label="AfterGlow"></pre>
      <p class="prompt"><span class="ps">$</span> afterglow settings<span class="cursor" aria-hidden="true"> </span></p>
    </header>
    <main>
      <h2><span class="dim">#</span> wallpaper</h2>
      <p class="dim hint">Every monitor shows the one you pick. Options apply straight away to the one that's showing.</p>
      <div id="cards" class="cards"></div>
    </main>
    <footer class="dim">pause, pause rules and start at login live in the tray menu</footer>
  </body>
</html>
