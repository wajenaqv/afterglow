<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>All clocks</title>
    <style>
      body { margin: 0; background: #111; color: #9c9; font: 13px/1.3 "JetBrains Mono", Consolas, monospace; }
      .grid { display: grid; gap: 10px; padding: 10px; }
      figure { margin: 0; }
      .frame { width: 100%; overflow: hidden; position: relative; background: #000; }
      iframe { border: 0; transform-origin: 0 0; position: absolute; }
      figcaption { padding: 3px 0 0; }
    </style>
  </head>
  <body>
    <div class="grid" id="g"></div>
    <script type="module">
      import { STYLES } from "/src/wallpapers/clockstyles.js";
      // Every clock wallpaper style (the switched-off ones too), live, side by side. ?portrait: as on a
      // vertical monitor (1080 x 1920 scaled down) instead of 1920 x 1080.
      const portrait = new URLSearchParams(location.search).has("portrait");
      const [W, H] = portrait ? [540, 960] : [640, 360];
      const styles = [...STYLES, "tube", "jelly", "eclipse", "phosphor", "light", "radar", "scope"];
      const g = document.getElementById("g");
      g.style.gridTemplateColumns = `repeat(${portrait ? 8 : 4}, 1fr)`;
      styles.forEach((s, i) => {
        const f = document.createElement("figure");
        f.innerHTML = `<div class="frame" style="aspect-ratio:${W} / ${H}"><iframe style="width:${W}px;height:${H}px" src="/wallpapers/clock.html?all&style=${s}&hover=0${location.search.replace("?", "&")}"></iframe></div><figcaption>${i + 1}. ${s}</figcaption>`;
        g.append(f);
      });
      const fit = () => document.querySelectorAll(".frame").forEach((fr) => (fr.firstChild.style.transform = `scale(${fr.clientWidth / W})`));
      addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
