name: site

# The download page (site/) on GitHub Pages. Pages must be switched on once:
# repo Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site.js", "src/brand.css", "assets/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

# Two jobs, not one: right after an upload GitHub may not list the page yet, and
# deploy-pages then fails with "No artifacts named github-pages". Starting a
# second job gives it a few seconds; the second try covers a longer delay.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun scripts/site.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
