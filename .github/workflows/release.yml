name: release

# Push a version tag to build AfterGlow for Windows and macOS:
#   git tag v0.1.0 && git push origin v0.1.0
# This creates a DRAFT GitHub Release and attaches
#   AfterGlow_<version>_x64-setup.exe   (Windows installer, unsigned)
#   AfterGlow_<version>_universal.dmg   (macOS, Apple Silicon + Intel, not notarized)
# Review the draft and press Publish. install.sh (the macOS one-liner) always
# fetches the latest PUBLISHED release, so nothing reaches users before that.
# Steps and the optional macOS certificate: docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # run it on a tag ("Use workflow from" -> the tag)

permissions:
  contents: write

jobs:
  # One draft release that both builds upload to (two jobs each creating
  # their own draft would race and make two drafts).
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Run this on a version tag (v0.1.0), not a branch." >&2
            exit 1
          fi
          # Re-run: reuse this tag's draft. The list can lag a just-created
          # release, so a new one's id comes straight from the create reply.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f name="AfterGlow $TAG" -F draft=true \
              -F body=@.github/release-notes.md --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "Couldn't create or find the draft release." >&2
            exit 1
          fi
          echo "Draft release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Unsigned: Windows shows "Windows protected your PC" (More info -> Run anyway).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --bundles nsis

  macos:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Both Mac chips: one "universal" app for Apple Silicon and Intel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Signing. No Apple Developer account (hobby project), so no notarization.
      # With the APPLE_CERTIFICATE secrets set (a self-signed certificate, see
      # docs/releasing.md) every release carries the same signature, so macOS
      # keeps the Accessibility permission across updates. Without them the app
      # is signed ad hoc ("-"): it runs, but Accessibility must be granted again
      # after each update.
      - name: Choose the signing identity
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ]; then
            echo "Signing with the self-signed certificate."
            {
              echo "APPLE_CERTIFICATE=$(printf %s "$CERT" | tr -d '\n\r ')"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            } >> "$GITHUB_ENV"
          else
            echo "No certificate secrets: signing ad hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target universal-apple-darwin --bundles app,dmg
