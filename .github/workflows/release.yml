name: release

# Push a version tag to build AfterGlow for Windows and macOS:
#   git tag v0.1.0 && git push origin v0.1.0
# This creates a DRAFT GitHub Release and attaches
#   AfterGlow_<version>_x64-setup.exe   (Windows installer, unsigned)
#   AfterGlow_<version>_universal.dmg   (macOS, Apple Silicon + Intel, not notarized)
# plus what in-app updates use: the Mac app as .app.tar.gz, a .sig for each
# system, and latest.json (signed with the TAURI_SIGNING_PRIVATE_KEY secret).
# Review the draft and press Publish. install.sh (the macOS one-liner) always
# fetches the latest PUBLISHED release, so nothing reaches users before that.
# Steps and the optional macOS certificate: docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # run it on a tag ("Use workflow from" -> the tag)

permissions:
  contents: write

jobs:
  # One draft release that both builds upload to (two jobs each creating
  # their own draft would race and make two drafts).
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Run this on a version tag (v0.1.0), not a branch." >&2
            exit 1
          fi
          # In-app updates: without the key and its public half, stop now
          # rather than after a long build (docs/releasing.md)
          if [ -z "$UPDATE_KEY" ] || [ -z "$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)" ]; then
            echo "Set the TAURI_SIGNING_PRIVATE_KEY secret and plugins.updater.pubkey in tauri.conf.json." >&2
            exit 1
          fi
          # Re-run: reuse this tag's draft. The list can lag a just-created
          # release, so a new one's id comes straight from the create reply.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f name="AfterGlow $TAG" -F draft=true \
              -F body=@.github/release-notes.md --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "Couldn't create or find the draft release." >&2
            exit 1
          fi
          echo "Draft release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Unsigned: Windows shows "Windows protected your PC" (More info -> Run anyway).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: false # the updates job writes it for both systems
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

  macos:
    needs: draft
    # An Intel Mac: GitHub's Apple Silicon Macs (macos-latest) were too busy
    # in Nov 2026 and the job got cancelled unstarted. It still builds the
    # universal app (both chips). GitHub retires its Intel Macs in 2027:
    # switch back to macos-latest before then.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Both Mac chips: one "universal" app for Apple Silicon and Intel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Signing. No Apple Developer account (hobby project), so no notarization.
      # With the APPLE_CERTIFICATE secrets set (a self-signed certificate, see
      # docs/releasing.md) every release carries the same signature, so macOS
      # keeps the Accessibility permission across updates. Without them the app
      # is signed ad hoc ("-"): it runs, but Accessibility must be granted again
      # after each update.
      #
      # Tauri can't import a self-signed certificate itself: it only looks for
      # identities macOS trusts ("failed to resolve signing identity"). So the
      # certificate goes into a keychain here and Tauri gets its SHA-1
      # fingerprint, which it hands straight to codesign (codesign signs with
      # an untrusted certificate; only Gatekeeper cares, and we don't notarize).
      - name: Choose the signing identity
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "No certificate secrets: signing ad hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Signing with the self-signed certificate."
          KC="$RUNNER_TEMP/afterglow-signing.keychain-db"
          KC_PASS=$(uuidgen)
          printf %s "$CERT" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a password prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          # Put the keychain in the search list (codesign looks there).
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # The fingerprint of the identity with this name (untrusted is fine).
          HASH=$(security find-identity -p codesigning "$KC" \
            | grep -F "\"$IDENTITY\"" | head -n 1 | awk '{print $2}')
          if [ -z "$HASH" ]; then
            echo "No code-signing identity named \"$IDENTITY\" in the certificate. Identities found:" >&2
            security find-identity -p codesigning "$KC" >&2
            exit 1
          fi
          echo "Identity \"$IDENTITY\": $HASH"
          echo "APPLE_SIGNING_IDENTITY=$HASH" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: false # the updates job writes it for both systems
          args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Show the signature
        run: codesign -dv --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/AfterGlow.app 2>&1 | grep -E "Authority|Signature|TeamIdentifier|Identifier"

  # latest.json, once both builds are up: what installed copies read
  updates:
    needs: [draft, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern "*.sig" --dir sigs
          bun scripts/latest-json.js "$TAG" sigs
          gh release upload "$TAG" sigs/latest.json --clobber
