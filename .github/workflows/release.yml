name: release

# Push a version tag to publish a Windows installer:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds AfterGlow_<version>_x64-setup.exe and attaches it to a draft
# GitHub Release; review the draft and press Publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Unsigned for now: Windows SmartScreen shows "Windows protected your PC"
      # until the installer is code-signed (see CLAUDE.md, Distribution).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AfterGlow ${{ github.ref_name }}
          releaseBody: |
            Windows installer: download `AfterGlow_*_x64-setup.exe` below and run it.
            It installs for your user only (no admin needed).

            This build isn't code-signed yet, so Windows may show "Windows protected your PC".
            Click **More info**, then **Run anyway**.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
