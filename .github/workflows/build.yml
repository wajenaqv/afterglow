name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cache: windows
          # universal, as in a release: the compiled libraries saved here are
          # what release.yml reuses (tags can read what main saved)
          - os: macos-latest
            cache: macos-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache }}
          # a pull request's copy could only be read by that pull request
          save-if: ${{ github.event_name != 'pull_request' }}

      - run: bun install --frozen-lockfile

      # Unsigned builds: fine for personal use (v1). Signing comes later if ever public.
      - run: bun run tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v5
        with:
          name: afterglow-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
          if-no-files-found: warn
          retention-days: 14
