<!doctype html>
<!-- MOCK: controls that stand out. Shows the real Settings pages (open through
     `bun run dev`, /docs/ideas/controls-mockup.html) with the styles below put
     on top; the switch takes them off again. Nothing here ships. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AfterGlow · mockup: controls</title>
<link rel="stylesheet" href="/src/brand.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.5 "JetBrains Mono", Consolas, monospace; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  nav { display: flex; gap: 28px; padding: 7px 14px; border-bottom: 1px solid var(--dim); }
  nav span { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  nav button { font: inherit; color: var(--fg); background: none; border: 1px solid var(--dim); padding: 1px 10px; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<nav>
  <span>mock <button data-set="page" data-v="wallpaper">wallpaper</button><button data-set="page" data-v="apps">apps</button></span>
  <span>look <button data-set="look" data-v="before">before</button><button data-set="look" data-v="after">after</button></span>
</nav>
<iframe id="f" src="/index.html#wallpaper" title="Settings"></iframe>

<style id="after" media="not all">
  :root {
    --ctl: color-mix(in srgb, var(--fg) 13%, var(--bg));
    --ctl-faint: color-mix(in srgb, var(--fg) 8%, var(--bg));
    --ctl-edge: color-mix(in srgb, var(--fg) 45%, var(--bg));
    --quiet: color-mix(in srgb, var(--fg) 72%, var(--bg));
  }
  /* buttons: a filled block, no brackets */
  button:not(.clock-style) {
    background: var(--ctl); color: var(--bright); padding: 2px 10px;
    border: 1px solid var(--ctl-edge); cursor: pointer; text-shadow: none;
  }
  button:not(.clock-style)::before, button:not(.clock-style)::after { content: none; }
  button:not(.clock-style):hover:not(:disabled) { background: var(--fg); color: var(--bg); border-color: var(--fg); text-shadow: none; }
  button:focus-visible, .cyc:focus-within, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* the one primary button */
  button.use:not(:disabled) { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; padding: 4px 14px; }
  button.use:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
  button.use:disabled { background: none; border-color: transparent; color: var(--accent); cursor: default; padding-left: 0; }
  .wall-detail .actions { display: flex; gap: 10px; align-items: center; }
  .wall-detail .actions .still { background: none; padding: 4px 12px; }
  /* selectors: one block with lit arrows */
  .cyc { background: var(--ctl); border: 1px solid var(--ctl-edge); align-items: stretch; }
  .cyc-b { color: var(--accent); padding: 1px 1.1ch; font-weight: 700; }
  .cyc-b:hover { background: var(--fg); color: var(--bg); text-shadow: none; }
  .cyc select { padding: 1px 0.6ch; text-align: center; }
  .cyc select:focus { outline: none; }
  .wall-detail .opts label { display: grid; grid-template-columns: 94px minmax(0, 1fr) 4ch; gap: 10px; align-items: center; }
  .wall-detail .opts .cyc { justify-content: space-between; }
  .wall-detail .opts .cyc select { flex: 1; min-width: 0; }
  .wall-detail .opts label::after { content: attr(data-pos); color: var(--dim); font-size: 12px; text-shadow: none; }
  /* tabs: the picked one filled, the rest underlined */
  .tabs button:not(.clock-style) { background: none; border-color: transparent; border-bottom-color: var(--ctl-edge); color: var(--fg); }
  .tabs button[aria-selected="true"]:not(.clock-style) { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  /* cards look clickable */
  .cards .card[tabindex]:not(.open) { border-color: var(--ctl-edge); }
  .cards .card[tabindex]:hover { border: 1px solid var(--fg); background: var(--ctl-faint); }
  .cards .card[tabindex] .body::after { content: "configure >"; color: var(--accent); font-size: 12px; margin-top: auto; padding-top: 4px; }
  .cards .card.open .body::after { content: "open >"; color: var(--bright); }
  /* text you can't click steps back */
  .wall-detail .long, .wall-detail dd, .guide, .guide li { color: var(--quiet); font-weight: 400; text-shadow: none; }
  .guide b { color: var(--fg); }
  .connector .status { color: var(--quiet); }
  .guide a { color: var(--bright); }
  /* check boxes and fields */
  input[type="checkbox"], input[type="radio"] { color: var(--accent); }
  label:has(> input[type="checkbox"]):hover, label:has(> input[type="radio"]):hover { background: var(--ctl-faint); cursor: pointer; }
  input:not([type]), input[type="text"], input[type="password"] { border: 1px solid var(--ctl-edge); background: var(--ctl-faint); padding: 3px 8px; }
  /* the busy table: faint until its row is under the cursor */
  #apps .cyc, #apps button { background: var(--ctl-faint); border-color: transparent; }
  #apps tr:hover .cyc, #apps tr:hover button, #apps .cyc:focus-within { background: var(--ctl); border-color: var(--ctl-edge); }
  #apps button:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
  #apps td { padding-top: 4px; padding-bottom: 4px; }
</style>

<script>
  const f = document.querySelector("#f");
  const state = { page: "wallpaper", look: "after" };
  function apply() {
    for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-pressed", state[b.dataset.set] === b.dataset.v);
    const doc = f.contentDocument;
    if (!doc?.body) return;
    if (f.contentWindow.location.hash !== "#" + state.page) f.contentWindow.location.hash = state.page;
    let s = doc.querySelector("#mock-after");
    if (!s) {
      s = doc.createElement("style");
      s.id = "mock-after";
      s.textContent = document.querySelector("#after").textContent;
      doc.head.append(s);
      doc.addEventListener("click", () => setTimeout(positions));
      doc.addEventListener("change", () => setTimeout(positions));
    }
    s.disabled = state.look === "before";
    positions();
  }
  // "2/4": which choice of how many
  function positions() {
    for (const l of f.contentDocument.querySelectorAll(".wall-detail .opts label")) {
      const sel = l.querySelector("select");
      l.dataset.pos = `${sel.selectedIndex + 1}/${sel.options.length}`;
    }
  }
  document.querySelector("nav").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) { state[b.dataset.set] = b.dataset.v; apply(); }
  });
  // the real page builds its cards after it loads
  f.addEventListener("load", () => { apply(); setTimeout(apply, 800); setTimeout(apply, 2000); });
</script>
</body>
</html>
