<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="A WhatsApp message arrives and the jellyfish pulses green, then fades">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 14px; white-space: pre; font-variant-ligatures: none; }
    .log { font-size: 16px; }
    .head { fill: #4d8f6e; font-size: 13px; }
  </style>
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#000000"/>
  <text class="head" x="48" y="66">signals</text>
  <text class="log" x="48" y="112" opacity="0"><tspan fill="#7dffc0">&#9679; whatsapp</tspan><tspan fill="#33ff99">   new message</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.14;0.78;0.9;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text class="log" x="48" y="142" opacity="0"><tspan fill="#4d8f6e">  jellyfish</tspan><tspan fill="#33ff99">  pulse </tspan><tspan fill="#33ff99">#33ff99</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.21;0.78;0.9;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text class="log" x="48" y="172" opacity="0"><tspan fill="#4d8f6e">  afterglow</tspan><tspan fill="#33ff99">  4s</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.28;0.78;0.9;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -6;0 -2;0 0;0 0" keyTimes="0;0.1;0.17;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
    <g filter="url(#g)" opacity="0.35">
      <animate attributeName="opacity" values="0.3;0.3;1;0.6;0.3;0.3" keyTimes="0;0.1;0.17;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
      <g fill="#ff9ecf">
        <animate attributeName="fill" values="#ff9ecf;#ff9ecf;#33ff99;#33ff99;#ff9ecf;#ff9ecf" keyTimes="0;0.1;0.17;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
      <text x="560" y="50" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">          .-=~~~~~=-.          </text>
      <text x="560" y="68" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">       .=~ .  .  .  ~=.        </text>
      <text x="560" y="86" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">     .~  .   .:.   .  ~.       </text>
      <text x="560" y="104" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">    /  .  :  .:.  :  .  \      </text>
      <text x="560" y="122" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">   :~=-.__.-=~~=-.__.-=~:      </text>
      <text x="560" y="140" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">    ;  :| :!: |: :!: |:  ;     </text>
      <text x="560" y="158" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">     ! :| ;:  |  :; |: !       </text>
      <text x="560" y="176" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">     : !  :!  ;  !:  ! :       </text>
      <text x="560" y="194" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">      ;:  !   :   !  :;        </text>
      <text x="560" y="212" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">       :  ;   !   ;  :         </text>
      <text x="560" y="230" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">         '    :    '           </text>
      <text x="560" y="248" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">              .                </text>
      </g>
    </g>
    <g fill="#ff9ecf">
      <animate attributeName="fill" values="#ff9ecf;#ff9ecf;#eafff3;#33ff99;#ff9ecf;#ff9ecf" keyTimes="0;0.1;0.17;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
      <text x="560" y="50" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">          .-=~~~~~=-.          </text>
      <text x="560" y="68" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">       .=~ .  .  .  ~=.        </text>
      <text x="560" y="86" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">     .~  .   .:.   .  ~.       </text>
      <text x="560" y="104" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">    /  .  :  .:.  :  .  \      </text>
      <text x="560" y="122" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">   :~=-.__.-=~~=-.__.-=~:      </text>
      <text x="560" y="140" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">    ;  :| :!: |: :!: |:  ;     </text>
      <text x="560" y="158" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">     ! :| ;:  |  :; |: !       </text>
      <text x="560" y="176" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">     : !  :!  ;  !:  ! :       </text>
      <text x="560" y="194" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">      ;:  !   :   !  :;        </text>
      <text x="560" y="212" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">       :  ;   !   ;  :         </text>
      <text x="560" y="230" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">         '    :    '           </text>
      <text x="560" y="248" textLength="260.40000000000003" lengthAdjust="spacingAndGlyphs">              .                </text>
    </g>
  </g>
</svg>
