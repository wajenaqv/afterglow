[package]
name = "afterglow"
version = "0.1.0"
description = "Live ASCII wallpapers that glow when something happens"
authors = ["Mohammad Wajih"]
license = "MIT"
repository = "https://github.com/wajenaqv/afterglow"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "afterglow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows: Win32 calls for putting windows behind the desktop icons and for
# the pause rules (fullscreen apps, battery)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Power",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "UI_Notifications",
  "UI_Notifications_Management",
] }

# macOS: Objective-C messages to NSWindow (desktop level, all Spaces)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
