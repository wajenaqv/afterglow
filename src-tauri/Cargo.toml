[package]
name = "afterglow"
version = "0.1.10"
description = "Live ASCII wallpapers that glow when something happens"
authors = ["Mohammad Wajih"]
license = "MIT"
repository = "https://github.com/wajenaqv/afterglow"
edition = "2024"

[lib]
# not "afterglow": on Windows the library's name must differ from the program's
name = "afterglow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# preserve_order: Claude Code's settings keep their order (claude.rs)
serde_json = { version = "1", features = ["preserve_order"] }

# Windows: Win32 calls for putting windows behind the desktop icons and for
# the pause rules (fullscreen apps, battery)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Power",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
] }

# macOS: Objective-C messages to NSWindow (desktop level, all Spaces)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
collapsible_if = "allow"
